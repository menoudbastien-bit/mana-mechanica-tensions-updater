# Wake ahead of the first phase; the runner handles all six batches and targeted retries.
name: Collect Mana Mechanica auction data
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tensions.yml'
      - '.github/workflows/darkmoon-depth.yml'
      - 'scripts/blizzard/**'
      - 'lib/blizzard/**'
      - 'tests/blizzard-collector.mjs'
      - 'tests/blizzard-listing-metrics.mjs'
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: read
concurrency:
  group: mana-mechanica-tensions
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Verify source identity and calculations
        run: node --test tests/blizzard-collector.mjs tests/blizzard-listing-metrics.mjs
      - name: Collect due Blizzard houses and verify stored readback
        env:
          MM_TENSIONS_APPLICATION_TOKEN: ${{ secrets.MM_TENSIONS_APPLICATION_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module -e 'process.stdout.write(JSON.stringify({projectId:"appgprj_6adf82cdbe1081919f3e44ce1525cd98",siteUrl:"https://mana-mechanica.com",applicationToken:process.env.MM_TENSIONS_APPLICATION_TOKEN})+"\n")' | node scripts/blizzard/update-watchlist.mjs --stdin --hourly-batches

  darkmoon:
    needs: update
    if: ${{ !cancelled() && github.event_name != 'push' }}
    permissions: {}
    uses: ./.github/workflows/darkmoon-depth.yml

  analyze-pilot:
    needs: [update, darkmoon]
    if: ${{ !cancelled() && github.event_name != 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Analyze the saved Europe PvE Alliance snapshot
        env:
          MM_TENSIONS_APPLICATION_TOKEN: ${{ secrets.MM_TENSIONS_APPLICATION_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          sleep 600
          node --input-type=module <<'NODE'
          const response = await fetch('https://mana-mechanica.com/api/blizzard/analyze', {
            method: 'POST',
            headers: {Authorization: 'Bearer ' + process.env.MM_TENSIONS_APPLICATION_TOKEN},
            signal: AbortSignal.timeout(120000),
          });
          if (!response.ok) {
            console.log('::warning::Pilot analysis could not complete (HTTP ' + response.status + ').');
            process.exit(0);
          }
          console.log(JSON.stringify(await response.json()));
          NODE
