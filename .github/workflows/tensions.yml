# Poll scheduler every five minutes; each physical house follows its source's hourly phase.
name: Collect Mana Mechanica Blizzard watchlist
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tensions.yml'
      - 'scripts/blizzard/**'
      - 'lib/blizzard/**'
      - 'tests/blizzard-collector.mjs'
      - 'tests/blizzard-listing-metrics.mjs'
  schedule:
    - cron: '*/5 * * * *'
permissions:
  contents: read
concurrency:
  group: mana-mechanica-tensions
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Verify source identity and calculations
        run: node --test tests/blizzard-collector.mjs tests/blizzard-listing-metrics.mjs
      - name: Collect due Blizzard houses and verify stored readback
        env:
          MM_TENSIONS_APPLICATION_TOKEN: ${{ secrets.MM_TENSIONS_APPLICATION_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module -e 'process.stdout.write(JSON.stringify({projectId:"appgprj_6adf82cdbe1081919f3e44ce1525cd98",siteUrl:"https://mana-mechanica.com",applicationToken:process.env.MM_TENSIONS_APPLICATION_TOKEN})+"\n")' | node scripts/blizzard/update-watchlist.mjs --stdin --scheduled-retries --follow-near-deadline
