name: Check collection changes
on:
  pull_request:
    paths:
      - 'scripts/blizzard/**'
      - 'lib/blizzard/**'
      - 'tests/blizzard-*.mjs'
      - '.github/workflows/check-collector.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false
      - run: node --test tests/blizzard-collector.mjs tests/blizzard-listing-metrics.mjs
